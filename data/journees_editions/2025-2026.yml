intro:
  - >
    Cette édition accueille les journées nationales du GDR SciLog à Lille, sur
    le campus Cité Scientifique. Elle est pensée comme un point de rencontre
    pour présenter des résultats, des démonstrations, des posters et des
    actions collectives de la communauté.
  - >
    AFADL 2026 est organisé en marge des journées nationales les 2 et 3 juin.

important_dates:
  - label: "Journées à Lille"
    date: "1er–4 juin 2026"
  - label: "Inscription au tarif non majoré"
    date: "avant le 13 mai 2026"
  - label: "AFADL 2026"
    date: "2–3 juin 2026"

calls:
  - title: "AFADL 2026 — Appel à contributions"
    summary: >
      AFADL rassemble les acteurs académiques et industriels intéressés par
      les approches formelles pour l'assistance au développement de logiciels
      et de systèmes.
    contribution_types:
      - "Recherche originale, 4 à 8 pages"
      - "Session doctorants, 2 à 4 pages"
      - "Démonstrations d'outils, 2 à 4 pages"
      - "Présentations de projets, 2 à 4 pages"
      - "Résumés longs, 2 à 4 pages"
    deadlines:
      - label: "Date limite de soumission"
        date: "vendredi 10 avril 2026"
      - label: "Notification aux auteurs"
        date: "jeudi 7 mai 2026"
      - label: "Version finale des articles"
        date: "vendredi 22 mai 2026"
    chairs:
      - "Julien Brunel, ONERA DTIS & Université de Toulouse"
      - "Delphine Longuet, Thales Research & Technology"
  - title: "Posters, démonstrations et présentations GDR"
    summary: >
      Cette section sert à publier les appels internes du GDR : posters,
      démonstrations, présentations de groupes, prix, concours et sessions
      liées aux défis scientifiques.
    items:
      - "Appel à posters"
      - "Démonstrations d'outils"
      - "Prix du meilleur poster"
      - "Sessions des défis scientifiques"
    status: "À compléter par le comité d'organisation"

programme:
  summary: >
    Le programme détaillé de cette édition, structuré par journées.
  days:
    - date: "Lundi 1er juin 2026"
      items:
        - time: "13h30"
          title: "Accueil des participants"
        - time: "Après-midi"
          title: "Ouverture des journées et sessions GDR"
        - time: "Soir"
          title: "Cocktail de bienvenue"
    - date: "Mardi 2 juin 2026"
      items:
        - time: "Journée"
          title: "Sessions scientifiques, AFADL, posters et démonstrations"
        - time: "Soir"
          title: "Activité optionnelle"
    - date: "Mercredi 3 juin 2026"
      items:
        - time: "Journée"
          title: "Sessions scientifiques, AFADL, défis et groupes"
        - time: "Soir"
          title: "Dîner de gala"
    - date: "Jeudi 4 juin 2026"
      items:
        - time: "Journée"
          title: "Sessions GDR, synthèses et clôture"
        - time: "17h30"
          title: "Fin des journées"

